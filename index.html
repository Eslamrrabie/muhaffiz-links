<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُحفِّظ — دعوة</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0b1511;color:#faf6ec;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:420px;width:100%;background:#12201a;border:1px solid #22302a;border-radius:28px;padding:32px 22px}
  h1{margin:0 0 6px;font-size:30px;color:#c9a24b}
  p{color:#c9c4b6;line-height:1.8}
  a.btn{display:block;margin:12px 0;padding:14px;border-radius:40px;text-decoration:none;font-weight:700}
  .open{background:#c9a24b;color:#1f2a26}
  .store{border:1px solid #c9a24b;color:#c9a24b}
  small{color:#7a7a7a}
</style>
</head>
<body>
<div class="card">
  <h1>مُحفِّظ</h1>
  <p id="msg">تمت دعوتك للانضمام. افتح التطبيق وسجّل دخولك، وستدخل مباشرة.</p>
  <a class="btn open" id="open" href="#">افتح في التطبيق</a>
  <a class="btn store" id="store" href="https://play.google.com/store/apps/details?id=com.islamfawzy.werd">تثبيت التطبيق</a>
  <small>إن لم يكن التطبيق مثبتاً، ثبّته أولاً ثم ارجع واضغط «افتح في التطبيق».</small>
</div>
<script>
  var code = new URLSearchParams(location.search).get('c') || '';
  var intent = 'intent://join?code=' + encodeURIComponent(code) +
               '#Intent;scheme=werd;package=com.islamfawzy.werd;end';
  document.getElementById('open').href = intent;
  if (!code) document.getElementById('msg').textContent = 'رابط الدعوة غير مكتمل. اطلب رابطاً جديداً.';
  if (/android/i.test(navigator.userAgent) && code) { setTimeout(function(){ location.href = intent; }, 500); }
  else if (!/android/i.test(navigator.userAgent)) {
    document.getElementById('msg').textContent = 'افتح هذا الرابط من هاتف أندرويد عليه تطبيق مُحفِّظ.';
  }
</script>
</body>
</html>
